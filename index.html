        <h3><strong>Factors from childhood that contribute to literary proficiency in adults
</strong></h3>
        <br>

          <p>What factors of an adult’s reading and writing experience during elementary and middle school most directly contribute and correlate to his or her current literacy skill? Having frequently interacted with those who tend to thrive in English-heavy environments as well as those who struggle, I have become curious to ascertain what might cause this to be the case. This question was pursued in order to gain an understanding of how a good sense of literacy as it pertains to reading and writing is developed. Exploring this topic thoroughly is vital to improving our education system, especially for teaching younger children before they eventually enter into the higher echelons of academia. It has been agreed upon by many scholars, especially in the past three decades, that literacy skill has been decreasing (Graff). In this article, the perspectives of past scholars on the topic are analyzed and new research was conducted to contribute to it. Information from over 43 participants was collected regarding their reading and writing skill development, and also gathered writing samples to compare for results...</p>
